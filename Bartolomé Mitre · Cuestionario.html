<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bartolomé Mitre · Cuestionario</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#d9c28f; --sheet:#ecdcae; --sheet2:#e3cf9b; --ink:#2e2216; --soft:#6b5638;
  --line:#a98d57; --ok:#41602f; --bad:#8e3321; --fiber:rgba(120,90,40,.10); --fiber2:rgba(120,90,40,.05);
  --shadow:rgba(60,40,10,.28); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1710; --sheet:#3a2f1e; --sheet2:#322818; --ink:#efe0b8; --soft:#b9a176;
    --line:#7a643b; --ok:#9bc27f; --bad:#e08a72; --fiber:rgba(230,200,130,.07); --fiber2:rgba(230,200,130,.035);
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1710; --sheet:#3a2f1e; --sheet2:#322818; --ink:#efe0b8; --soft:#b9a176;
  --line:#7a643b; --ok:#9bc27f; --bad:#e08a72; --fiber:rgba(230,200,130,.07); --fiber2:rgba(230,200,130,.035);
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif; font-size:20px; line-height:1.5;
  display:flex; justify-content:center; padding:32px 16px 48px;
}
.sheet{
  width:100%; max-width:640px; align-self:flex-start; padding:44px clamp(22px,6vw,56px) 40px;
  background:
    repeating-linear-gradient(0deg,var(--fiber) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(90deg,var(--fiber2) 0 1px,transparent 1px 19px),
    linear-gradient(170deg,var(--sheet),var(--sheet2));
  border-radius:3px 9px 4px 11px / 8px 3px 10px 4px;
  box-shadow:0 1px 0 var(--line), 0 14px 34px -10px var(--shadow);
  position:relative;
}
h1{font:400 clamp(30px,6vw,40px)/1.1 "IM Fell English",Georgia,serif; margin:0 0 4px; letter-spacing:.01em}
.sub{margin:0; color:var(--soft); font-style:italic}
.rule{height:0; border:0; border-top:1px solid var(--line); margin:22px 0 26px; opacity:.8}
.ticks{display:flex; gap:6px; margin-bottom:26px}
.ticks i{flex:1; height:3px; background:var(--line); opacity:.35; transition:opacity .3s,background .3s}
.ticks i.on{opacity:1; background:var(--ink)}
.ticks i.ok{opacity:1; background:var(--ok)}
.ticks i.bad{opacity:1; background:var(--bad)}
.num{color:var(--soft); font-style:italic; margin:0 0 6px}
.q{font:400 clamp(23px,4.6vw,28px)/1.3 "IM Fell English",Georgia,serif; margin:0 0 22px}
.opts{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.opt{
  width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:transparent; border:1px solid var(--line); border-radius:2px;
  padding:10px 14px; display:flex; gap:14px; align-items:baseline; transition:background .15s,border-color .15s;
}
.opt b{font-weight:600; color:var(--soft); min-width:1.2em}
.opt:hover:not(:disabled){background:rgba(120,90,40,.12); border-color:var(--ink)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok); color:var(--ok); background:rgba(65,96,47,.10); font-weight:600}
.opt.wrong{border-color:var(--bad); color:var(--bad); background:rgba(142,51,33,.09); text-decoration:line-through; text-decoration-thickness:1px}
.opt.dim{opacity:.55}
.note{margin:20px 0 0; padding-left:14px; border-left:2px solid var(--line); color:var(--soft); min-height:2.9em}
.note strong{color:var(--ink); font-weight:600}
.bar{display:flex; justify-content:flex-end; margin-top:24px; min-height:44px}
.btn{
  font:600 19px "Cormorant Garamond",Georgia,serif; color:var(--sheet); background:var(--ink);
  border:0; border-radius:2px; padding:9px 24px; cursor:pointer;
}
.btn:hover{opacity:.88}
.end{text-align:center; padding:6px 0 4px}
.score{font:400 clamp(64px,16vw,96px)/1 "IM Fell English",Georgia,serif; margin:8px 0 0}
.score small{font-size:.38em; color:var(--soft)}
.verdict{margin:14px auto 28px; max-width:30em}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="sheet">
  <h1>Bartolomé Mitre</h1>
  <p class="sub">Diez preguntas sobre su vida (1821–1906)</p>
  <hr class="rule">
  <div class="ticks" id="ticks" aria-hidden="true"></div>

  <section id="quiz">
    <p class="num" id="num"></p>
    <h2 class="q" id="q"></h2>
    <ul class="opts" id="opts"></ul>
    <p class="note" id="note" aria-live="polite"></p>
    <div class="bar"><button class="btn hidden" id="next"></button></div>
  </section>

  <section id="end" class="end hidden">
    <p class="num">Tu resultado</p>
    <p class="score" id="score"></p>
    <p class="verdict" id="verdict"></p>
    <button class="btn" id="again">Volver a empezar</button>
  </section>
</main>

<script>
const Q=[
 {q:"¿En qué ciudad y año nació Bartolomé Mitre?",o:["Montevideo, 1810","Buenos Aires, 1821","Córdoba, 1830","Rosario, 1835"],a:1,
  e:"Nació en Buenos Aires el 26 de junio de 1821."},
 {q:"Durante el gobierno de Rosas, ¿dónde transcurrió buena parte de su juventud en el exilio?",o:["Londres","Río de Janeiro","Montevideo","Asunción"],a:2,
  e:"En Montevideo se formó como militar, periodista y poeta; más tarde pasó también por Bolivia, Perú y Chile."},
 {q:"¿Qué batalla de 1852, en la que participó, puso fin al gobierno de Rosas?",o:["Caseros","Chacabuco","Maipú","Ituzaingó"],a:0,
  e:"En Caseros (3 de febrero de 1852) el Ejército Grande de Urquiza derrotó a Rosas, y Mitre integró esas fuerzas."},
 {q:"¿Qué batalla de 1861 comandó frente a las fuerzas de la Confederación de Urquiza?",o:["Cepeda","Caseros","Pavón","Curupaytí"],a:2,
  e:"Tras Pavón, Urquiza se retiró del campo y se abrió el camino a la reunificación del país bajo liderazgo porteño."},
 {q:"¿Qué años abarcó su presidencia de la Nación?",o:["1852–1858","1862–1868","1868–1874","1874–1880"],a:1,
  e:"Fue el primer presidente de la Argentina unificada, de 1862 a 1868."},
 {q:"¿En qué guerra fue comandante en jefe de los ejércitos aliados?",o:["Guerra del Pacífico","Guerra de la Triple Alianza","Guerra del Brasil","Conquista del Desierto"],a:1,
  e:"La Triple Alianza reunió a Argentina, Brasil y Uruguay contra el Paraguay de Solano López (1865–1870)."},
 {q:"¿Quién lo sucedió en la presidencia en 1868?",o:["Nicolás Avellaneda","Julio A. Roca","Domingo F. Sarmiento","Justo José de Urquiza"],a:2,
  e:"Domingo Faustino Sarmiento asumió el 12 de octubre de 1868."},
 {q:"¿Qué diario fundó en 1870, que se sigue publicando?",o:["La Prensa","La Nación","Clarín","La Capital"],a:1,
  e:"Fundó La Nación el 4 de enero de 1870, y desde ese diario intervino en la vida pública durante décadas."},
 {q:"¿Cuál de estas obras escribió Mitre?",o:["Historia de Belgrano y de la Independencia Argentina","Facundo","Martín Fierro","Recuerdos de provincia"],a:0,
  e:"Además escribió la Historia de San Martín y de la emancipación sudamericana. Mitre fue, junto con su labor política, un destacado historiador."},
 {q:"¿En qué año murió?",o:["1890","1898","1902","1906"],a:3,
  e:"Murió en Buenos Aires el 19 de enero de 1906, a los 84 años."}
];
const $=id=>document.getElementById(id);
const roman=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
let i=0,score=0,done=false,res=[];

function ticks(){
  $("ticks").innerHTML=Q.map((_,k)=>`<i class="${k<res.length?(res[k]?'ok':'bad'):(k===i?'on':'')}"></i>`).join("");
}
function show(){
  done=false; const c=Q[i];
  $("num").textContent="Pregunta "+roman[i]+" de X";
  $("q").textContent=c.q;
  $("note").textContent="";
  $("next").classList.add("hidden");
  $("opts").innerHTML="";
  c.o.forEach((t,k)=>{
    const li=document.createElement("li"), b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML=`<b>${"ABCD"[k]}.</b><span></span>`; b.lastChild.textContent=t;
    b.addEventListener("click",()=>pick(k));
    li.appendChild(b); $("opts").appendChild(li);
  });
  ticks();
}
function pick(k){
  if(done) return; done=true;
  const c=Q[i], ok=k===c.a; if(ok) score++; res.push(ok);
  [...$("opts").querySelectorAll(".opt")].forEach((b,n)=>{
    b.disabled=true;
    if(n===c.a) b.classList.add("right"); else if(n===k) b.classList.add("wrong"); else b.classList.add("dim");
  });
  $("note").innerHTML=`<strong>${ok?"Correcto.":"No es esa."}</strong> `;
  $("note").appendChild(document.createTextNode(c.e));
  const n=$("next"); n.textContent=i===Q.length-1?"Ver resultado":"Siguiente";
  n.classList.remove("hidden"); n.focus(); ticks();
}
function finish(){
  $("quiz").classList.add("hidden"); $("end").classList.remove("hidden");
  $("score").innerHTML=`${score}<small> / 10</small>`;
  $("verdict").textContent = score===10 ? "Puntaje perfecto: conocés la vida de Mitre al detalle."
    : score>=8 ? "Muy buen resultado. Dominás lo esencial de su biografía."
    : score>=5 ? "Un buen comienzo. Un repaso más y lo tenés."
    : "Todavía hay mucho por descubrir sobre Mitre. Probá de nuevo.";
  ticks();
}
$("next").addEventListener("click",()=>{ if(i<Q.length-1){i++;show();} else finish(); });
$("again").addEventListener("click",()=>{ i=0;score=0;res=[]; $("end").classList.add("hidden"); $("quiz").classList.remove("hidden"); show(); });
show();
</script>
</body>
</html>
